<header class="topbar">
  <a class="brand" routerLink="/solicitudes">Asigna Tech</a>
  <nav>
    <a routerLink="/solicitudes" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Solicitudes</a>
    <a routerLink="/solicitudes/nueva" routerLinkActive="active">Nueva</a>
    <div class="dropdown" [class.open]="dominiosAbierto()" (click)="$event.stopPropagation()">
      <button
        type="button"
        class="dropdown-toggle"
        [class.active]="dominiosActivo()"
        [attr.aria-expanded]="dominiosAbierto()"
        aria-haspopup="true"
        (click)="alternarDominios($event)"
      >
        Dominios
      </button>
      <div class="dropdown-menu" role="menu">
        <a routerLink="/dominios/servicios" routerLinkActive="active" role="menuitem">Servicio</a>
        <a routerLink="/dominios/tecnicos" routerLinkActive="active" role="menuitem">Técnico</a>
        <a routerLink="/dominios/objetos" routerLinkActive="active" role="menuitem">Objeto</a>
      </div>
    </div>
  </nav>
</header>
<main>
  <router-outlet />
</main>
<app-loading-overlay />
<app-toast-host />
